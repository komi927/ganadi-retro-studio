<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ガナディ ローポリスタジオ PS1風</title>
  <meta name="description" content="ガナディとゴニャニを動かし、表情やポーズで遊べるPS1風の3Dスタジオ。" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./vendor/tailwind-utilities.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles/app.css?v=2" />
</head>
<body>

  <!-- ==================== 3D PIXEL-ART VIEWPORT ==================== -->
  <main id="viewportWrap">
    <canvas id="webglCanvas"></canvas>

    <!-- Crisp Floating Speech Bubble (Clamped inside Viewport Edges) -->
    <div id="speechBubble" class="speech-bubble hidden glass-panel border-2 border-[#222532] rounded-2xl px-3 py-1.5 text-xs sm:text-sm font-extrabold text-[#222532] whitespace-nowrap shadow-md"></div>
    <div id="plazaBubble" class="speech-bubble hidden glass-panel border-2 border-[#222532] rounded-2xl px-3 py-1.5 text-xs sm:text-sm font-extrabold text-[#222532] whitespace-nowrap shadow-md"></div>

    <button id="btnToggleHud" type="button" class="pixel-btn glass-panel rounded-xl text-xs font-extrabold" aria-label="UIを隠す" title="UIを隠す（Hキー）" aria-controls="hudChrome settingsDrawer" aria-pressed="false">
      <span aria-hidden="true">👁</span>
      <span class="hud-toggle-label">UIを隠す</span>
    </button>
    <div id="hudChrome">
      <header id="topHudBar" class="absolute z-30 flex items-center justify-between gap-1.5 pointer-events-none">
        <!-- Mode Toggle Pill (Top-Left) -->
        <div class="pointer-events-auto flex items-center gap-1.5">
          <div class="glass-panel pixel-card rounded-2xl p-1 flex items-center gap-1">
            <button id="btnModeWorld" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-colors bg-[#222532] text-white">
              🌿 <span class="hidden sm:inline">3D </span>広場
            </button>
            <button id="btnModeStudio" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-colors text-[#222532] hover:bg-slate-200/70">
              🔄 スタジオ
            </button>
          </div>
        </div>

        <!-- 設定 -->
        <div class="pointer-events-auto flex items-center gap-1.5">
          <button id="btnOpenSettings" title="設定・カメラメニュー" aria-label="設定・カメラ" aria-controls="settingsDrawer" aria-expanded="false" class="glass-panel pixel-btn rounded-xl px-2.5 sm:px-3 h-9 flex items-center justify-center text-xs font-extrabold gap-1">
            <span aria-hidden="true">⚙️</span><span>設定</span>
          </button>
        </div>
      </header>

      <div id="characterPicker" role="group" aria-label="操作するキャラクター" class="absolute z-30 glass-panel pixel-card rounded-2xl p-1 flex items-center gap-1">
        <button type="button" data-character="ganadi" aria-pressed="true" class="character-btn active rounded-xl px-2.5 py-1.5 text-xs font-extrabold">🐶 ガナディ</button>
        <button type="button" data-character="gonyani" aria-pressed="false" class="character-btn rounded-xl px-2.5 py-1.5 text-xs font-extrabold">🐱 ゴニャニ</button>
      </div>

      <div id="plazaTools" hidden>
        <button id="btnPlazaMenu" type="button" class="pixel-btn glass-panel rounded-xl px-2.5 text-xs font-extrabold" aria-controls="worldStops" aria-expanded="false">広場メニュー</button>
        <div id="worldStops" class="glass-panel pixel-card rounded-xl p-1.5" role="group" aria-label="広場メニュー" hidden>
          <button id="btnCompanion" type="button" class="character-btn rounded-lg px-2.5 text-xs font-extrabold" aria-pressed="false">🐾 相方を呼ぶ</button>
          <button id="btnVisitBench" type="button" aria-label="ゴンニョンイのベンチへ" class="character-btn rounded-lg px-2.5 text-xs font-extrabold">🪑 ベンチへ</button>
          <button id="btnVisitSnack" type="button" class="character-btn rounded-lg px-2.5 text-xs font-extrabold">🍰 おやつ台へ</button>
          <button id="btnQuickSpawn" type="button" class="character-btn rounded-lg px-2.5 text-xs font-extrabold">✨ ＋5体</button>
        </div>
      </div>

      <!-- 表情メニュー -->
      <div id="mobileEmoteBar" class="no-scrollbar" role="group" aria-label="表情を選ぶ" hidden>
        <div id="mobileEmoteStrip"></div>
      </div>

      <div id="sceneActions" class="flex gap-1.5">
        <button id="btnEmotes" type="button" aria-expanded="false" aria-controls="mobileEmoteBar" class="pixel-btn glass-panel rounded-xl px-2.5 text-xs font-extrabold">😊 表情</button>
        <button id="btnForms" type="button" aria-expanded="false" aria-controls="formMenu" class="pixel-btn glass-panel rounded-xl px-2.5 text-xs font-extrabold">🐾 かたち</button>
        <button id="btnPet" type="button" title="Fキー、またはキャラを直接タップ" class="pixel-btn glass-panel rounded-xl px-2.5 text-xs font-extrabold">✋ なでる</button>
        <button id="btnScenePhoto" type="button" title="広場やスタジオを背景ごとPNGで保存" class="pixel-btn glass-panel rounded-xl px-2.5 text-xs font-extrabold">📷 写真</button>
        <button id="btnPlazaAction" type="button" title="Eキーでも操作" class="hidden pixel-btn rounded-xl px-2.5 text-xs font-extrabold"></button>
        <div id="formMenu" class="glass-panel pixel-card rounded-2xl p-1.5" role="group" aria-label="かたちを選ぶ" hidden></div>
      </div>

      <!-- Multi-Touch Virtual Gamepad (Analog Joystick + Right-Thumb Round Action Buttons) -->
      <div id="virtualPad" class="hidden">
        <!-- Left Thumb: 360° Analog Joystick with Auto-Dash Ring (>78%) -->
        <div id="joyZone">
          <div id="joyBase">
            <div id="joyDashBadge">💨 DASH!</div>
            <div id="joyKnob">🐾</div>
          </div>
        </div>

        <!-- Right Thumb: Tactile Round Action Buttons -->
        <div id="actionCluster">
          <div class="flex flex-col gap-2.5 mb-1">
            <button id="btnPadDash" class="round-act-btn" title="ダッシュ切替">
              <span class="text-base leading-none">💨</span>
              <span class="mt-0.5">ダッシュ</span>
            </button>
            <button id="btnPadQuad" class="round-act-btn" title="2足 / 4足 切替">
              <span id="padQuadIcon" class="text-base leading-none">🚶</span>
              <span id="padQuadText" class="mt-0.5">2足</span>
            </button>
          </div>
          <button id="btnPadJump" class="round-act-btn" title="ジャンプ">
            <span class="text-xl leading-none">⬆️</span>
            <span class="mt-0.5">ジャンプ</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Error Message Box (never uses alert) -->
    <div id="errorBanner" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/40 p-4">
      <div class="glass-panel pixel-card rounded-2xl max-w-md w-full p-5 text-center space-y-2">
        <div class="text-lg font-extrabold text-rose-600">WebGL初期化エラー</div>
        <div id="errorText" class="text-xs font-bold text-slate-700 break-words"></div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="absolute left-1/2 z-40 pointer-events-none"></div>
  </main>

  <!-- Mobile Bottom-Sheet Backdrop -->
  <div id="drawerBackdrop"></div>

  <!-- ==================== DESKTOP SIDEBAR / MOBILE SLIDE-UP BOTTOM SHEET ==================== -->
  <aside id="settingsDrawer" class="glass-panel desktop-hidden" inert>
    <!-- Drawer Header -->
    <div class="px-3.5 py-2 border-b-2 border-[#222532]/15 flex items-center justify-between bg-white/80">
      <div class="text-xs sm:text-sm font-extrabold text-[#222532] flex items-center gap-1.5">
        <span>🐾</span>
        <span>設定・カメラ</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btnHideFromDrawer" type="button" title="UIを隠す" aria-label="UIを隠す" class="pixel-btn bg-white rounded-lg w-8 h-8 items-center justify-center text-sm">👁</button>
        <button id="btnSoundDrawer" title="効果音 ON/OFF" class="pixel-btn bg-white rounded-lg w-8 h-8 flex items-center justify-center text-sm">🔊</button>
        <button id="btnReset" title="位置・カメラリセット" class="pixel-btn bg-white rounded-lg px-2 h-8 flex items-center justify-center text-xs font-extrabold">↺ リセット</button>
        <button id="btnCloseDrawer" title="閉じる" class="pixel-btn bg-slate-200 rounded-lg w-8 h-8 flex items-center justify-center text-xs font-extrabold">✕</button>
      </div>
    </div>

    <div id="drawerScroll" class="flex-1 overflow-y-auto thin-scroll p-3 space-y-3">
      <details class="control-help">
        <summary>遊び方・ショートカット</summary>
        <div class="px-2 py-1.5">
          <div id="worldKeyHints" class="text-[10px] leading-relaxed text-slate-600">
          <span class="px-1 py-0.5 rounded bg-slate-200 text-[#222532] mono">WASD</span> 移動 ·
          <span class="px-1 py-0.5 rounded bg-slate-200 text-[#222532] mono">Shift</span> 走る ·
          <span class="px-1 py-0.5 rounded bg-slate-200 text-[#222532] mono">Space</span> 跳ぶ ·
          <span class="px-1 py-0.5 rounded bg-slate-200 text-[#222532] mono">Q</span> 4足 ·
          <span id="emoteKeyHint" class="px-1 py-0.5 rounded bg-slate-200 text-[#222532] mono">1–0</span> 表情
          </div>
          <div id="studioHintText" class="hidden text-[10px] leading-relaxed text-slate-600">
          ドラッグで回転 · ピンチ / ホイールで拡大縮小
          </div>
          <div class="text-[10px] leading-relaxed text-slate-600">HでUI切替 · Fでなでる · Pで写真</div>
        </div>
      </details>

      <!-- Low-Poly / PS1 / Smooth Model Style Switcher -->
      <div class="bg-pink-50/95 border-2 border-[#222532] rounded-2xl p-2.5 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold text-[#222532]">💎 3Dモデル表現</span>
          <span id="polyCountBadge" class="mono text-[10px] px-1.5 py-0.5 rounded bg-white border border-[#222532]/30 font-bold text-pink-600">436 tris</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5">
          <button data-style="lowpoly" class="style-btn pixel-btn active rounded-xl py-1.5 text-[11px] font-extrabold">ローポリ</button>
          <button data-style="ps1"     class="style-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">🎮 PS1レトロ</button>
          <button data-style="smooth"  class="style-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">🫧 なめらか</button>
        </div>
        <div class="grid grid-cols-2 gap-1.5 text-[11px] font-extrabold">
          <label class="flex items-center gap-1.5 bg-white border-2 border-[#222532] rounded-xl py-1 px-2 cursor-pointer">
            <input id="chkFlatShade" type="checkbox" checked class="accent-[#222532] w-3.5 h-3.5" />
            <span>パキッと面陰影</span>
          </label>
          <label class="flex items-center gap-1.5 bg-white border-2 border-[#222532] rounded-xl py-1 px-2 cursor-pointer">
            <input id="chkWireframe" type="checkbox" class="accent-[#222532] w-3.5 h-3.5" />
            <span>ワイヤー表示</span>
          </label>
        </div>
      </div>

      <!-- 2-Leg / 4-Leg Hybrid Switch -->
      <div class="bg-sky-50/90 border-2 border-[#222532] rounded-2xl p-2.5">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-extrabold text-[#222532]">🐕 歩行スタイル</span>
          <span class="mono text-[10px] px-1.5 py-0.5 rounded bg-white border border-[#222532]/30 font-bold">Qキー</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button id="btnStyleBiped" class="pixel-btn active rounded-xl py-1.5 text-xs font-extrabold">🚶 2足立ち</button>
          <button id="btnStyleQuad" class="pixel-btn bg-white rounded-xl py-1.5 text-xs font-extrabold">🐾 4足歩き</button>
        </div>
      </div>

      <!-- Crowd Spawner (World Mode) -->
      <div id="crowdPanel" class="bg-amber-50/90 border-2 border-[#222532] rounded-2xl p-2.5">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-extrabold text-[#222532]">🏃 みんなで遊ぶ</span>
          <span id="crowdCountBadge" class="mono text-[10px] px-1.5 py-0.5 rounded bg-white border border-[#222532]/30 font-bold">1体</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5">
          <button id="btnSpawn5" class="col-span-2 pixel-btn bg-[#ffd166] hover:bg-[#ffca4f] text-[#222532] rounded-xl py-1.5 text-xs font-extrabold">
            ✨ +5体 増殖
          </button>
          <button id="btnClearCrowd" class="pixel-btn bg-white hover:bg-rose-50 text-[#222532] rounded-xl py-1.5 text-xs font-extrabold">
            クリア
          </button>
        </div>
      </div>

      <!-- Camera Presets & Zoom / Pitch Sliders -->
      <div class="bg-slate-100/90 border border-slate-200 rounded-2xl p-2.5 space-y-2.5">
        <div class="text-[11px] font-extrabold text-slate-600">🎥 カメラ角度・ズーム</div>
        <div class="grid grid-cols-4 gap-1.5">
          <button data-yaw="0"   data-pitch="6" class="preset-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">正面<br/><span class="mono text-[9px] opacity-65">0°</span></button>
          <button data-yaw="35"  data-pitch="12" class="preset-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">斜め<br/><span class="mono text-[9px] opacity-65">35°</span></button>
          <button data-yaw="90"  data-pitch="10" class="preset-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">真横<br/><span class="mono text-[9px] opacity-65">90°</span></button>
          <button data-yaw="180" data-pitch="16" class="preset-btn pixel-btn bg-white rounded-xl py-1.5 text-[11px] font-extrabold">背面<br/><span class="mono text-[9px] opacity-65">180°</span></button>
        </div>

        <!-- Zoom Slider -->
        <div>
          <div class="flex items-center justify-between text-[11px] font-bold text-slate-600 mb-1">
            <span>🔍 ズーム距離</span>
            <span id="zoomValLabel" class="mono text-[10px] font-bold text-[#222532]">10.0</span>
          </div>
          <input id="sliderZoom" type="range" min="4.0" step="0.1" value="10.0" class="ganadi-range" />
        </div>

        <!-- Pitch Slider -->
        <div>
          <div class="flex items-center justify-between text-[11px] font-bold text-slate-600 mb-1">
            <span>📐 見下ろし角 (Pitch)</span>
            <span id="pitchValLabel" class="mono text-[10px] font-bold text-[#222532]">22°</span>
          </div>
          <input id="sliderPitch" type="range" min="6" max="68" step="1" value="22" class="ganadi-range" />
        </div>
      </div>

      <!-- Pixel Resolution, Outline, Auto-Rotate & Virtual Pad Toggle -->
      <div class="bg-slate-100/90 border border-slate-200 rounded-2xl p-2.5 space-y-2.5">
        <div id="retroResolution" hidden>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[11px] font-extrabold text-slate-600">PS1風の描画解像度（短辺）</span>
            <span id="pixelSizeLabel" class="mono text-[10px] font-bold text-pink-600">320 px</span>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button data-px="512" class="px-btn pixel-btn bg-white rounded-xl py-1 text-xs font-extrabold mono">512</button>
            <button data-px="320" class="px-btn pixel-btn active rounded-xl py-1 text-xs font-extrabold mono">320</button>
            <button data-px="256" class="px-btn pixel-btn bg-white rounded-xl py-1 text-xs font-extrabold mono">256</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-1.5 text-[11px] font-extrabold">
          <label class="flex items-center gap-1.5 bg-white border-2 border-[#222532] rounded-xl py-1.5 px-2 cursor-pointer">
            <input id="chkOutline" type="checkbox" class="accent-[#222532] w-4 h-4" />
            <span>輪郭線</span>
          </label>
          <label class="flex items-center gap-1.5 bg-white border-2 border-[#222532] rounded-xl py-1.5 px-2 cursor-pointer">
            <input id="chkAutoRot" type="checkbox" class="accent-[#222532] w-4 h-4" />
            <span>自動回転</span>
          </label>
          <label class="col-span-2 flex items-center justify-between bg-white border-2 border-[#222532] rounded-xl py-1.5 px-2.5 cursor-pointer">
            <span class="flex items-center gap-1.5"><span>🎮</span><span>仮想パッド表示 (タッチ操作)</span></span>
            <input id="chkVirtualPad" type="checkbox" class="accent-[#222532] w-4 h-4" />
          </label>
        </div>
      </div>

      <!-- All 12 Expressions & Poses -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-extrabold text-slate-600">😊 表情・ポーズ</span>
          <span class="mono text-[10px] text-slate-400 font-bold">1-0キー</span>
        </div>
        <div id="emoteGrid" class="grid grid-cols-2 gap-1.5"></div>
      </div>

      <!-- Transparent PNG & Low-Poly GLB Export -->
      <div class="grid grid-cols-2 gap-1.5">
        <button id="btnExportPng" class="pixel-btn bg-[#222532] text-white hover:bg-slate-800 rounded-2xl py-2.5 px-2 text-xs font-extrabold flex items-center justify-center gap-1">
          <span>📷</span>
          <span>透過PNG保存</span>
        </button>
        <button id="btnExportGlb" class="pixel-btn bg-[#ff7a9e] text-white hover:bg-[#f2658b] rounded-2xl py-2.5 px-2 text-xs font-extrabold flex items-center justify-center gap-1">
          <span>📦</span>
          <span>.GLB 書き出し</span>
        </button>
      </div>
    </div>
  </aside>

  <script type="module" src="./src/app.js?v=9"></script>
</body>
</html>
